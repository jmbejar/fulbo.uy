app = "fulbo-uy"
primary_region = "iad"
swap_size_mb = 512

[env]
  # Runs Solid Queue (and the recurring sync jobs) inside Puma.
  SOLID_QUEUE_IN_PUMA = "true"

[[mounts]]
  source = "data"
  destination = "/rails/storage"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine always on so the recurring sync jobs run.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/up"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
